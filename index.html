<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little Sanctuary</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1530;--bg2:#2a1f42;--card:#33284f;--ink:#f6ecf0;--mute:#b9aacb;--rose:#f08aa3;--gold:#f4c27a;--line:#4a3d6b;--on-accent:#2a1420;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#fbf1f3;--bg2:#f4e2e8;--card:#fff;--ink:#2d1a2e;--mute:#7a647f;--rose:#c8456a;--gold:#b9741c;--line:#e7cdd6;--on-accent:#fff}}
:root[data-theme="light"]{--bg:#fbf1f3;--bg2:#f4e2e8;--card:#fff;--ink:#2d1a2e;--mute:#7a647f;--rose:#c8456a;--gold:#b9741c;--line:#e7cdd6;--on-accent:#fff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;line-height:1.55}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0}
button,select,textarea,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
section{margin-top:44px}
section>h2{font-size:1.7rem;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 16px}
/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg))}
.gate h1{font-size:2.4rem;font-style:italic;font-weight:400}
.pins{display:flex;gap:12px;justify-content:center;margin:24px 0 8px}
.pin{width:52px;height:64px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;font-size:1.8rem;background:var(--card)}
.pin.on{border-color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:10px;justify-content:center;margin-top:16px}
.pad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.25rem;cursor:pointer}
.pad button:hover{border-color:var(--rose)}
.err{color:var(--rose);min-height:1.5em;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* header */
.hero{text-align:center;padding:36px 12px 8px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:400;font-style:italic}
.days{font-family:'Fraunces',serif;font-size:clamp(4rem,16vw,8rem);line-height:1;color:var(--gold);font-weight:600;margin:8px 0 0}
.clock{color:var(--mute);font-variant-numeric:tabular-nums}
.since{margin-top:10px;color:var(--mute);font-size:.95rem}
.since input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.status{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left}
.status.a{border-top:5px solid var(--rose)}.status.b{border-top:5px solid var(--gold)}
.status input.name{background:none;border:0;border-bottom:1px dashed var(--line);font-family:'Fraunces',serif;font-size:1.4rem;width:100%;padding:0 0 2px}
.mood{margin:12px 0 4px;font-size:1.15rem;min-height:2.2em}
.status select{width:100%;padding:9px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
@media(max-width:560px){.pair{grid-template-columns:1fr}}
/* feed */
.who{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:10px}
.who button{border:0;background:none;padding:8px 18px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--rose);color:var(--on-accent);font-weight:700}
textarea{width:100%;min-height:90px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:12px;resize:vertical}
.btn{border:0;border-radius:999px;background:var(--gold);color:#2a1a08;font-weight:700;padding:11px 24px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.feed{list-style:none;margin:20px 0 0;padding:0 0 0 22px;border-left:2px solid var(--line);max-height:420px;overflow-y:auto}
.feed li{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.feed li::before{content:"";position:absolute;left:-30px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.feed .meta{font-size:.85rem;color:var(--mute)}.feed .meta b{color:var(--c)}
.feed p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
/* envelopes */
.env{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.envelope{position:relative;height:130px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;overflow:hidden;font-family:'Fraunces',serif;font-size:1.1rem;padding:48px 14px 0;transition:transform .2s}
.envelope::before{content:"";position:absolute;inset:0 0 auto 0;height:62px;background:var(--bg2);clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:1px solid var(--line)}
.envelope::after{content:"♥";position:absolute;top:36px;left:calc(50% - 12px);width:24px;height:24px;border-radius:50%;background:var(--rose);color:var(--on-accent);font-size:.8rem;display:grid;place-items:center;font-family:sans-serif}
.envelope:hover{transform:translateY(-4px) rotate(-1deg)}
.envelope span{position:relative;display:block;margin-top:22px}
.modal{position:fixed;inset:0;background:rgba(10,5,20,.7);display:grid;place-items:center;padding:20px;z-index:50}
.letter{background:#fff8ee;color:#3a2430;max-width:480px;width:100%;border-radius:6px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .35s ease-out;max-height:85vh;overflow:auto}
.letter h3{font-style:italic;font-weight:400;margin-bottom:12px;font-size:1.4rem}
.letter p{font-family:'Fraunces',serif;font-size:1.08rem;margin:0 0 18px}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
/* wheel */
.spin{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.wheelbox{position:relative;width:min(300px,78vw);aspect-ratio:1}
.wheelbox::before{content:"";position:absolute;top:-10px;left:calc(50% - 12px);border:12px solid transparent;border-top:22px solid var(--ink);z-index:3}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--ink);position:relative;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);
background:conic-gradient(#e05a7d 0 60deg,#f4c27a 60deg 120deg,#7c6bd6 120deg 180deg,#4fb3a5 180deg 240deg,#ee8f5e 240deg 300deg,#a35fc4 300deg 360deg)}
.wheel i{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel i b{position:absolute;left:-52px;top:-128px;width:104px;text-align:center;font-style:normal;font-size:.72rem;line-height:1.15;color:#1b1024;font-weight:700}
.hub{position:absolute;inset:calc(50% - 22px);width:44px;height:44px;border-radius:50%;background:var(--bg);border:3px solid var(--ink);z-index:2}
.win{background:var(--card);border:2px dashed var(--gold);border-radius:18px;padding:22px;text-align:center;min-height:150px;display:grid;place-items:center}
.win h3{font-size:1.7rem;color:var(--gold)}
.win.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}}
.conf{position:fixed;top:-20px;font-size:1.4rem;pointer-events:none;animation:fall 2.4s linear forwards;z-index:60}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:700px){.spin{grid-template-columns:1fr;justify-items:center}.spin>div:last-child{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const PIN = "1432";
const MOODS = ["Missing you","Busy","Free to talk","Planning date night","Thinking of you","Sleepy"];
const LETTERS = [
 {t:"Open when you miss me", m:"Close your eyes for a second. I’m right there with you: in the quiet, in the little things you do without thinking, in every song that makes you smile. Distance is only a number; you are always the closest thing to home I have. Count the days until we’re together again, and know that I’m counting too."},
 {t:"Open when you’re stressed", m:"Breathe in slowly. Whatever is weighing on you right now, you don’t have to carry it alone. You have handled hard things before and I’ve watched you do it with so much grace. Put the list down for ten minutes. I’m proud of you, and I’m on your side, always."},
 {t:"Open when you need a laugh", m:"Remember the time we couldn’t stop laughing and the whole room had no idea why? I think about that more than you know. You are the funniest, silliest, most wonderful person I’ve ever met. Now go call me and let’s be ridiculous together. Bonus points for snorting."},
 {t:"Open when you can’t sleep", m:"Shh, it’s okay. The world can wait until morning. Picture us on the sofa under that ugly blanket we love, rain on the window, your head on my shoulder. Let your thoughts float away like paper boats. I’m thinking of you, and I’ll be there when the sun comes up. Goodnight, my love."}
];
const DATES = ["Candlelit home-cooked dinner","Movie marathon blanket fort","Sunset picnic in the park","Cook a new cuisine together","Stargazing with hot chocolate","Board game tournament"];
const SEG = 360/DATES.length;

function Gate({onOpen}){
  const [code,setCode]=useState(""); const [err,setErr]=useState(""); const [shake,setShake]=useState(false);
  const press=(d)=>{
    if(code.length>=4) return;
    const next=code+d; setCode(next); setErr("");
    if(next.length===4){
      if(next===PIN) setTimeout(onOpen,200);
      else { setShake(true); setErr("That’s not our code. Try again."); setTimeout(()=>{setCode("");setShake(false)},500); }
    }
  };
  useEffect(()=>{
    const h=(e)=>{ if(/^\d$/.test(e.key)) press(e.key); if(e.key==="Backspace") setCode(c=>c.slice(0,-1)); };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  });
  return (
    <div className="gate"><div>
      <h1>Our little sanctuary</h1>
      <p className="sub">Enter your 4-digit code to come in. (Hint: 1432)</p>
      <div className={"pins "+(shake?"shake":"")} aria-live="polite">
        {[0,1,2,3].map(i=><div key={i} className={"pin "+(i===code.length?"on":"")}>{code[i]?"♥":""}</div>)}
      </div>
      <div className="err" role="alert">{err}</div>
      <div className="pad">
        {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} onClick={()=>press(String(n))}>{n}</button>)}
        <button onClick={()=>setCode("")} aria-label="Clear">C</button>
        <button onClick={()=>press("0")}>0</button>
        <button onClick={()=>setCode(c=>c.slice(0,-1))} aria-label="Delete">⌫</button>
      </div>
    </div></div>
  );
}

function Header({names,setNames,moods,setMoods}){
  const [since,setSince]=useState("2023-02-14");
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[]);
  const diff=Math.max(0,now-new Date(since+"T00:00:00").getTime());
  const days=Math.floor(diff/864e5), h=Math.floor(diff/36e5)%24, m=Math.floor(diff/6e4)%60, s=Math.floor(diff/1e3)%60;
  return (
    <header className="hero">
      <h1>{names[0]} &amp; {names[1]}</h1>
      <div className="days" aria-label={days+" days together"}>{days.toLocaleString()}</div>
      <div>days of us</div>
      <div className="clock">+ {h}h {String(m).padStart(2,"0")}m {String(s).padStart(2,"0")}s</div>
      <div className="since"><label>Together since <input type="date" value={since} onChange={e=>e.target.value&&setSince(e.target.value)}/></label></div>
      <div className="pair">
        {[0,1].map(i=>(
          <div key={i} className={"status "+(i?"b":"a")}>
            <input className="name" aria-label={"Partner "+"AB"[i]+" name"} value={names[i]} onChange={e=>setNames(n=>n.map((x,j)=>j===i?e.target.value:x))}/>
            <div className="mood">Feeling: <b>{moods[i]}</b></div>
            <select aria-label={"Mood for "+names[i]} value={moods[i]} onChange={e=>setMoods(ms=>ms.map((x,j)=>j===i?e.target.value:x))}>
              {MOODS.map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
        ))}
      </div>
    </header>
  );
}

function Feed({names}){
  const [who,setWho]=useState(0); const [text,setText]=useState("");
  const [posts,setPosts]=useState([{id:1,a:0,t:new Date(Date.now()-36e5),x:"Good morning, you. Can’t wait for the weekend."},{id:2,a:1,t:new Date(Date.now()-18e5),x:"Same. I’m already planning something for us."}]);
  const post=()=>{ if(!text.trim())return; setPosts(p=>[{id:Date.now(),a:who,t:new Date(),x:text.trim()},...p]); setText(""); };
  return (
    <section>
      <h2>Our timeline</h2><p className="sub">Little notes, newest first.</p>
      <div className="who" role="group" aria-label="Posting as">
        {[0,1].map(i=><button key={i} aria-pressed={who===i} onClick={()=>setWho(i)}>{names[i]||"Partner "+"AB"[i]}</button>)}
      </div>
      <textarea aria-label="Message" placeholder={"Write something sweet as "+names[who]+"…"} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))post()}}/>
      <button className="btn" disabled={!text.trim()} onClick={post}>Post to feed</button>
      <ul className="feed">
        {posts.map(p=>(
          <li key={p.id} style={{"--c":p.a?"var(--gold)":"var(--rose)"}}>
            <div className="meta"><b>{names[p.a]}</b> · {p.t.toLocaleDateString([], {day:"numeric",month:"short"})} at {p.t.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div>
            <p>{p.x}</p>
          </li>
        ))}
      </ul>
    </section>
  );
}

function Letters(){
  const [open,setOpen]=useState(null);
  useEffect(()=>{ const h=e=>{if(e.key==="Escape")setOpen(null)}; window.addEventListener("keydown",h); return()=>window.removeEventListener("keydown",h)},[]);
  return (
    <section>
      <h2>Love letters</h2><p className="sub">Four envelopes, sealed for the moments you need them.</p>
      <div className="env">
        {LETTERS.map((l,i)=><button key={i} className="envelope" onClick={()=>setOpen(i)}><span>{l.t}</span></button>)}
      </div>
      {open!==null && (
        <div className="modal" onClick={()=>setOpen(null)}>
          <div className="letter" role="dialog" aria-modal="true" aria-label={LETTERS[open].t} onClick={e=>e.stopPropagation()}>
            <h3>{LETTERS[open].t}</h3>
            <p>{LETTERS[open].m}</p>
            <button className="btn" autoFocus onClick={()=>setOpen(null)}>Close letter</button>
          </div>
        </div>
      )}
    </section>
  );
}

function Spinner(){
  const [rot,setRot]=useState(0); const [busy,setBusy]=useState(false);
  const [win,setWin]=useState(null); const [pop,setPop]=useState(false); const [bits,setBits]=useState([]);
  const spin=()=>{
    if(busy) return;
    const idx=Math.floor(Math.random()*DATES.length);
    const center=idx*SEG+SEG/2;
    const base=Math.ceil(rot/360)*360;
    setBusy(true); setWin(null); setPop(false);
    setRot(base+5*360+(360-center));
    setTimeout(()=>{
      setWin(idx); setPop(true); setBusy(false);
      setBits(Array.from({length:24},(_,k)=>({k,l:Math.random()*100,d:Math.random()*.8,e:["💖","✨","🎉","🌹"][k%4]})));
      setTimeout(()=>setBits([]),3400);
    },4300);
  };
  return (
    <section>
      <h2>Date night spinner</h2><p className="sub">Can’t decide? Let the wheel choose.</p>
      <div className="spin">
        <div className="wheelbox">
          <div className="wheel" style={{transform:`rotate(${rot}deg)`}}>
            {DATES.map((d,i)=><i key={i} style={{transform:`rotate(${i*SEG+SEG/2}deg)`}}><b>{d}</b></i>)}
          </div>
          <div className="hub"/>
        </div>
        <div>
          <button className="btn" onClick={spin} disabled={busy}>{busy?"Spinning…":"Spin the wheel"}</button>
          <div className={"win "+(pop?"pop":"")} style={{marginTop:14}} aria-live="polite">
            {win===null ? <p className="sub" style={{margin:0}}>{busy?"Fingers crossed…":"Your date night will show up here."}</p>
              : <div><div>It’s decided! Tonight is…</div><h3>🎉 {DATES[win]}</h3></div>}
          </div>
        </div>
      </div>
      {bits.map(b=><span key={b.k} className="conf" style={{left:b.l+"%",animationDelay:b.d+"s"}}>{b.e}</span>)}
    </section>
  );
}

function App(){
  const [authed,setAuthed]=useState(false);
  const [names,setNames]=useState(["Partner A","Partner B"]);
  const [moods,setMoods]=useState(["Missing you","Free to talk"]);
  if(!authed) return <Gate onOpen={()=>setAuthed(true)}/>;
  return (
    <div className="wrap">
      <Header names={names} setNames={setNames} moods={moods} setMoods={setMoods}/>
      <Feed names={names}/>
      <Letters/>
      <Spinner/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
